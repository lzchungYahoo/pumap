<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>靜宜大學・人工智慧應用學系 | PU AAI 智慧領航島</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #06101c;
      --bg-panel: rgba(9, 22, 38, 0.88);
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --cyan: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }

    .font-serif-tc {
      font-family: 'Noto Serif TC', serif;
    }

    /* Diagonal pinstripe luxury tech background (inspired by reference site) */
    .pinstripe-bg {
      background-color: #06111e;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(212, 175, 55, 0.04) 0px,
        rgba(212, 175, 55, 0.04) 1px,
        transparent 1px,
        transparent 14px
      );
    }

    /* Double-line gold border card */
    .double-gold-card {
      position: relative;
      background: linear-gradient(160deg, rgba(10, 26, 44, 0.96), rgba(5, 14, 26, 0.98));
      border: 1px solid rgba(212, 175, 55, 0.65);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), inset 0 0 30px rgba(56, 189, 248, 0.06);
    }
    .double-gold-card::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: inherit;
      pointer-events: none;
    }

    .gold-pill-btn {
      background: linear-gradient(135deg, #e5c158 0%, #c59b27 100%);
      color: #07111e;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
    }
    .gold-pill-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow: 0 6px 26px rgba(212, 175, 55, 0.5);
    }

    .glass-hud {
      background: rgba(7, 18, 32, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.32);
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.4); border-radius: 999px; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    .animate-glow { animation: pulseGlow 3s ease-in-out infinite; }

    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas-container canvas:active { cursor: grabbing; }

    .landmark-label {
      position: absolute;
      transform: translate(-50%, -120%);
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }
    .landmark-label:hover {
      transform: translate(-50%, -128%) scale(1.05);
    }
  </style>
</head>
<body class="pinstripe-bg select-none">

      </div>

      <p class="text-[11px] sm:text-xs uppercase tracking-[0.22em] text-[#d4af37] font-semibold mb-2">

      <h1 class="font-serif-tc text-2xl sm:text-3xl font-bold text-white tracking-wide mb-2">

        <div id="loading-bar" class="h-full bg-gradient-to-r from-[#d4af37] via-[#f3e5ab] to-[#38bdf8] transition-all duration-300" style="width: 25%"></div>
      </div>

      <button id="enter-island-btn" type="button" class="gold-pill-btn rounded-full px-8 py-3 text-sm tracking-wider inline-flex items-center gap-2 cursor-pointer">

  </div>

  <!-- Main 3D Interactive Canvas -->
  <div id="canvas-container" class="fixed inset-0 z-0"></div>

  <!-- 2D Isometric Fallback (shown automatically only if WebGL fails) -->
  <div id="fallback-2d" class="hidden fixed inset-0 z-0 flex items-center justify-center p-6 pinstripe-bg overflow-auto">
    <div class="max-w-4xl w-full glass-hud rounded-2xl p-6 sm:p-8 text-center">

      <h2 class="font-serif-tc text-2xl font-bold text-white mb-2">靜宜大學人工智慧應用學系・智慧領航島</h2>

  <!-- 3D Projected Floating Labels -->

  <!-- Top Navigation HUD -->

      <div class="leading-tight">
        <div class="font-serif-tc text-sm font-bold text-white">靜宜大學・人工智慧應用學系</div>

    <div class="flex items-center gap-2 pointer-events-auto">
      <button id="btn-tour" type="button" class="gold-pill-btn rounded-full px-3.5 py-1.5 text-xs flex items-center gap-1.5 cursor-pointer">

  <!-- Bottom Landmark Dock -->

  <script>
    (function () {
      "use strict";

      // ==========================================
      // 1. Grounded Department Data (PU AAI)
      // ==========================================
      const LANDMARKS = [
        {
          id: "hub",
          code: "01 · DEPT HUB",
          shortName: "AI 領航主樓",
          title: "主顧樓 AI 領航中心",
          icon: "🏛️",
          color: 0xd4af37,
          pos: [0, 0, 0],
          camOffset: [9, 6.5, 11],
          summary: "114 學年度由「資訊傳播工程學系」正式更名為「人工智慧應用學系」，隸屬靜宜大學資訊學院。",
          render: () => `
            <div class="rounded-xl bg-slate-900/70 border border-[#d4af37]/30 p-4 space-y-2">

              <p class="text-slate-200 leading-relaxed">以培育具人工智慧能力之資通訊技術與應用人才為宗旨，秉持「<strong class="text-[#f3e5ab]">科技為經、藝術為緯、文化為本、創意為用</strong>」理念，結合資訊工程軟體設計力與數位媒體美學創作力。</p>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div class="rounded-xl bg-slate-900/60 border border-slate-700/70 p-3">

                <div class="text-xs text-[#38bdf8]">碩士班 36 學分</div>
              </div>
              <div class="rounded-xl bg-slate-900/60 border border-slate-700/70 p-3">
                <div class="text-[11px] text-slate-400">所屬學院</div>
                <div class="text-base font-bold text-white mt-0.5">資訊學院</div>
                <div class="text-xs text-[#d4af37]">College of Computing</div>

            </div>
            <div class="space-y-2">
              <div class="text-xs font-semibold text-[#38bdf8] uppercase tracking-wider">教學特色亮點</div>
              <ul class="space-y-2 text-xs text-slate-300 leading-relaxed">
                <li class="flex gap-2"><span class="text-[#d4af37]">◆</span><span><strong>實作導向學習</strong>：理論與實務並重，搭配專任助教與自主學習社群，培育解決實務問題能力。</span></li>
                <li class="flex gap-2"><span class="text-[#d4af37]">◆</span><span><strong>畢業專題成果展</strong>：2～4 人小組跨學期完成 AI、系統開發、XR 互動或遊戲設計專案並公開展出。</span></li>
                <li class="flex gap-2"><span class="text-[#d4af37]">◆</span><span><strong>暑期與全學期企業實習</strong>：大四可參與校外企業實習，無縫接軌「畢業即就業」。</span></li>
              </ul>
            </div>
          `
        },
        {
          id: "tracks",
          code: "02 · FOUR PILLARS",
          shortName: "四大核心學群",
          title: "四大跨域核心學群館",
          icon: "💠",
          color: 0x38bdf8,
          pos: [-6.5, 0, -3.2],
          camOffset: [-13, 5.5, 4],
          summary: "以人工智慧為核心，橫向整合資料科學、互動元宇宙、科技藝術與數位人文四大應用領域。",
          render: () => {
            const tracks = [
              {
                key: "ds",
                name: "人工智慧與資料科學 (AI + DS)",
                tag: "核心技術",
                courses: ["機器學習概論", "深度學習", "類神經網路概論", "資料科學概論與大數據分析", "AI 智慧醫療實務應用", "雲端運算應用與服務", "AI 資安應用"]
              },
              {
                key: "xr",

                tag: "體感實作",
                courses: ["虛擬實境體驗系統開發 (Unity3D)", "擴增實境互動系統開發", "2D / 3D 遊戲設計", "人機介面與 UX 設計", "行動應用軟體開發", "物聯網互動設計入門"]
              },
              {
                key: "ta",

                courses: ["智慧電腦視覺", "3D 電腦動畫 (3DsMAX)", "數位特效與影像美學", "互動繪本設計", "智慧輔具設計", "配樂與影像氛圍"]

              {

            ];
            return `
              <p class="text-xs text-slate-300 leading-relaxed">點擊下方學群標籤，查看各領域重點專業選修課程：</p>
              <div class="flex flex-wrap gap-1.5" id="track-tabs">

            const btns = document.querySelectorAll(".track-tab-btn");
            const box = document.getElementById("track-detail-box");
            btns.forEach(btn => {
              btn.addEventListener("click", () => {
                btns.forEach(b => {

                btn.className = "track-tab-btn px-3 py-1.5 rounded-full text-xs font-medium border transition cursor-pointer bg-[#d4af37] text-slate-950 border-[#d4af37]";

          }

        {
          id: "curriculum",
          code: "03 · CURRICULUM",
          shortName: "四年課程地圖",
          title: "四年制核心課程地圖塔",
          icon: "📚",
          color: 0xa855f7,
          pos: [6.5, 0, -3.5],

          render: () => `
            <div class="grid grid-cols-4 gap-1.5" id="year-tabs">

      // ==========================================
      const container = document.getElementById("canvas-container");
      const labelsLayer = document.getElementById("labels-layer");
      const fallback2D = document.getElementById("fallback-2d");
      const fallbackGrid = document.getElementById("fallback-grid");

      let scene, camera, renderer, islandGroup;
      let targetSpherical = { radius: 22, theta: 0.6, phi: 1.05 };
      let currentSpherical = { radius: 22, theta: 0.6, phi: 1.05 };
      let targetLookAt = new THREE.Vector3(0, 1.2, 0);
      let currentLookAt = new THREE.Vector3(0, 1.2, 0);
      const buildingMeshes = [];
      const floatingObjects = [];
      const labelElements = [];

      function resetCamera() {
        targetSpherical = { radius: 22, theta: 0.6, phi: 1.05 };
        targetLookAt.set(0, 1.2, 0);
      }

      function flyToLandmark(lm) {
        const p = new THREE.Vector3(lm.pos[0], lm.pos[1] + 1.4, lm.pos[2]);
        const c = new THREE.Vector3(lm.camOffset[0], lm.camOffset[1], lm.camOffset[2]);
        const diff = c.clone().sub(p);
        const r = Math.max(9, diff.length());
        const phi = Math.acos(Math.min(0.95, Math.max(-0.95, diff.y / r)));
        const theta = Math.atan2(diff.x, diff.z);
        targetLookAt.copy(p);
        targetSpherical = { radius: r, theta, phi };
      }

      function activate2DFallback() {
        container.classList.add("hidden");
        labelsLayer.classList.add("hidden");
        fallback2D.classList.remove("hidden");
        fallbackGrid.innerHTML = LANDMARKS.map((lm, idx) => `
          <button type="button" data-fb-idx="${idx}" class="fb-card rounded-xl bg-slate-900/80 border border-[#d4af37]/35 hover:border-[#38bdf8] p-4 text-left transition cursor-pointer">
            <div class="text-xl mb-1">${lm.icon}</div>
            <div class="text-[10px] text-[#38bdf8] tracking-widest uppercase">${lm.code}</div>
            <div class="font-serif-tc text-base font-bold text-white mt-0.5">${lm.title}</div>
            <p class="text-xs text-slate-400 mt-1 line-clamp-2">${lm.summary}</p>
          </button>
        `).join("");
        document.querySelectorAll(".fb-card").forEach(card => {
          card.addEventListener("click", () => selectLandmark(Number(card.dataset.fbIdx)));
        });
      }

      function init3D() {
        try {
          if (typeof THREE === "undefined") throw new Error("Three.js missing");
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.shadowMap.enabled = true;
          container.appendChild(renderer.domElement);
        } catch (err) {
          activate2DFallback();
          return;
        }

        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x06101c, 0.018);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);

        // Lighting
        const ambient = new THREE.AmbientLight(0xbcd4f5, 0.75);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xfff1d0, 1.3);
        sun.position.set(14, 24, 12);
        sun.castShadow = true;
        scene.add(sun);

        const cyanLight = new THREE.PointLight(0x38bdf8, 1.4, 30);
        cyanLight.position.set(-8, 6, -6);
        scene.add(cyanLight);

        const goldLight = new THREE.PointLight(0xd4af37, 1.2, 30);
        goldLight.position.set(8, 5, 8);
        scene.add(goldLight);

        islandGroup = new THREE.Group();
        scene.add(islandGroup);

        // Base Ocean Plane
        const oceanGeo = new THREE.CircleGeometry(48, 64);
        const oceanMat = new THREE.MeshStandardMaterial({
          color: 0x071728,
          roughness: 0.35,
          metalness: 0.65
        });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = -0.6;
        scene.add(ocean);

        // Glowing Cyber Grid Ring on Ocean
        const ringGeo = new THREE.RingGeometry(11.8, 12.1, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = -0.48;
        scene.add(ring);

        // Main Island Platform
        const islandBaseGeo = new THREE.CylinderGeometry(11.2, 9.5, 1.1, 10);
        const islandBaseMat = new THREE.MeshStandardMaterial({ color: 0x0f253d, roughness: 0.7, metalness: 0.25 });
        const islandBase = new THREE.Mesh(islandBaseGeo, islandBaseMat);
        islandBase.position.y = -0.55;
        islandBase.receiveShadow = true;
        islandGroup.add(islandBase);

        // Gold Trim Ring on Island
        const trimGeo = new THREE.TorusGeometry(11.2, 0.08, 12, 64);
        const trimMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, emissive: 0x55420b, metalness: 0.85, roughness: 0.2 });
        const trim = new THREE.Mesh(trimGeo, trimMat);
        trim.rotation.x = Math.PI / 2;
        trim.position.y = 0.02;
        islandGroup.add(trim);

        // Subtle Roads / Pathways connecting center to landmarks
        LANDMARKS.slice(1).forEach(lm => {
          const dist = Math.hypot(lm.pos[0], lm.pos[2]);
          const pathGeo = new THREE.BoxGeometry(0.45, 0.06, dist);
          const pathMat = new THREE.MeshStandardMaterial({ color: 0x1e3a5f, emissive: 0x0c243d });
          const path = new THREE.Mesh(pathGeo, pathMat);
          path.position.set(lm.pos[0] / 2, 0.03, lm.pos[2] / 2);
          path.rotation.y = Math.atan2(lm.pos[0], lm.pos[2]);
          islandGroup.add(path);
        });

        // Build 6 Distinct Architectural Landmarks
        LANDMARKS.forEach((lm, idx) => {
          const g = new THREE.Group();
          g.position.set(lm.pos[0], lm.pos[1], lm.pos[2]);
          g.userData = { landmarkIndex: idx };

          // Pedestal
          const ped = new THREE.Mesh(
            new THREE.CylinderGeometry(1.6, 1.85, 0.35, 8),
            new THREE.MeshStandardMaterial({ color: 0x162e4a, metalness: 0.4, roughness: 0.5 })
          );
          ped.position.y = 0.175;
          g.add(ped);

          const accentMat = new THREE.MeshStandardMaterial({
            color: lm.color,
            emissive: lm.color,
            emissiveIntensity: 0.32,
            metalness: 0.7,
            roughness: 0.25
          });
          const bodyMat = new THREE.MeshStandardMaterial({
            color: 0xe2e8f0,
            metalness: 0.25,
            roughness: 0.4
          });

          if (lm.id === "hub") {
            const tower = new THREE.Mesh(new THREE.BoxGeometry(2.1, 3.6, 2.1), bodyMat);
            tower.position.y = 2.0;
            g.add(tower);

            const crown = new THREE.Mesh(new THREE.OctahedronGeometry(0.85, 0), accentMat);
            crown.position.y = 4.8;
            g.add(crown);
            floatingObjects.push({ mesh: crown, baseY: 4.8, speed: 1.5 });
          } else if (lm.id === "tracks") {
            const offsets = [[-0.65, -0.65], [0.65, -0.65], [-0.65, 0.65], [0.65, 0.65]];
            offsets.forEach(([ox, oz], k) => {
              const col = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 2.2 + k * 0.3, 6), k % 2 === 0 ? accentMat : bodyMat);
              col.position.set(ox, 1.3 + k * 0.15, oz);
              g.add(col);
            });
          } else if (lm.id === "curriculum") {
            for (let s = 0; s < 4; s++) {
              const stepBox = new THREE.Mesh(new THREE.BoxGeometry(2.2 - s * 0.42, 0.65, 2.2 - s * 0.42), s === 3 ? accentMat : bodyMat);
              stepBox.position.y = 0.6 + s * 0.65;
              g.add(stepBox);
            }
          } else if (lm.id === "labs") {
            const dome = new THREE.Mesh(new THREE.SphereGeometry(1.25, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), bodyMat);
            dome.position.y = 0.35;
            g.add(dome);
            const visor = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.16, 10, 24), accentMat);
            visor.rotation.x = Math.PI / 2;
            visor.position.y = 1.9;
            g.add(visor);
            floatingObjects.push({ mesh: visor, baseY: 1.9, speed: 2.0 });
          } else if (lm.id === "faculty") {
            const hall = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.8, 1.6), bodyMat);
            hall.position.y = 1.25;
            g.add(hall);
            const roof = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.1, 4), accentMat);
            roof.position.y = 2.7;
            roof.rotation.y = Math.PI / 4;
            g.add(roof);
          } else {
            const dish = new THREE.Mesh(new THREE.ConeGeometry(1.1, 1.8, 12), bodyMat);
            dish.position.y = 1.25;
            g.add(dish);
            const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 16), accentMat);
            beacon.position.y = 2.6;
            g.add(beacon);
            floatingObjects.push({ mesh: beacon, baseY: 2.6, speed: 2.3 });
          }

          // Tag all child meshes for raycasting
          g.traverse(child => {
            if (child.isMesh) {
              child.userData.landmarkIndex = idx;
              buildingMeshes.push(child);
            }
          });
          islandGroup.add(g);

          // Floating HTML Label
          const lbl = document.createElement("button");
          lbl.type = "button";
          lbl.className = "landmark-label glass-hud rounded-full px-3 py-1 text-[11px] font-semibold text-white flex items-center gap-1.5 shadow-lg hover:border-[#d4af37]";
          lbl.innerHTML = `<span>${lm.icon}</span><span>${lm.shortName}</span>`;
          lbl.addEventListener("click", (e) => {
            e.stopPropagation();
            stopTour();
            selectLandmark(idx);
          });
          labelsLayer.appendChild(lbl);
          labelElements.push({ el: lbl, pos: new THREE.Vector3(lm.pos[0], 3.8, lm.pos[2]) });
        });

        // Decorative Low-Poly Trees / Nodes around the island
        const nodePositions = [[-3.2, 2.5], [3.5, 2.2], [-2.8, -5.0], [3.2, -5.2], [-8.8, 1.2], [8.8, 1.0]];
        nodePositions.forEach(([nx, nz]) => {
          const tree = new THREE.Mesh(
            new THREE.ConeGeometry(0.45, 1.3, 6),
            new THREE.MeshStandardMaterial({ color: 0x0d9488, roughness: 0.7 })
          );
          tree.position.set(nx, 0.65, nz);
          islandGroup.add(tree);
        });

        // Pointer Orbit & Raycast
        let isDragging = false;
        let dragDistance = 0;
        let prevX = 0, prevY = 0;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const dom = renderer.domElement;
        dom.addEventListener("pointerdown", (e) => {
          isDragging = true;
          dragDistance = 0;
          prevX = e.clientX;
          prevY = e.clientY;
        });
        window.addEventListener("pointermove", (e) => {
          if (!isDragging) return;
          const dx = e.clientX - prevX;
          const dy = e.clientY - prevY;
          dragDistance += Math.hypot(dx, dy);
          prevX = e.clientX;
          prevY = e.clientY;
          targetSpherical.theta -= dx * 0.006;
          targetSpherical.phi = Math.min(1.42, Math.max(0.35, targetSpherical.phi - dy * 0.005));
        });
        window.addEventListener("pointerup", (e) => {
          if (!isDragging) return;
          isDragging = false;
          if (dragDistance < 6) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(buildingMeshes, false);
            if (hits.length > 0 && hits[0].object.userData.landmarkIndex !== undefined) {
              stopTour();
              selectLandmark(hits[0].object.userData.landmarkIndex);
            }
          }
        });
        dom.addEventListener("wheel", (e) => {
          e.preventDefault();
          targetSpherical.radius = Math.min(34, Math.max(8.5, targetSpherical.radius + e.deltaY * 0.012));
        }, { passive: false });

        window.addEventListener("resize", () => {
          if (!renderer || !camera) return;
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
          requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          if (autoOrbit && !isDragging && activeIndex === -1) {
            targetSpherical.theta += 0.0018;
          }

          currentSpherical.radius += (targetSpherical.radius - currentSpherical.radius) * 0.08;
          currentSpherical.theta += (targetSpherical.theta - currentSpherical.theta) * 0.08;
          currentSpherical.phi += (targetSpherical.phi - currentSpherical.phi) * 0.08;
          currentLookAt.lerp(targetLookAt, 0.08);

          const sinPhi = Math.sin(currentSpherical.phi);
          camera.position.set(
            currentLookAt.x + currentSpherical.radius * sinPhi * Math.sin(currentSpherical.theta),
            currentLookAt.y + currentSpherical.radius * Math.cos(currentSpherical.phi),
            currentLookAt.z + currentSpherical.radius * sinPhi * Math.cos(currentSpherical.theta)
          );
          camera.lookAt(currentLookAt);

          floatingObjects.forEach((fo, i) => {
            fo.mesh.position.y = fo.baseY + Math.sin(t * fo.speed + i) * 0.22;
            fo.mesh.rotation.y += 0.012;
          });

          // Project 3D label positions to 2D screen
          labelElements.forEach((item) => {
            const v = item.pos.clone().project(camera);
            if (v.z > 1) {
              item.el.style.display = "none";
            } else {
              item.el.style.display = "flex";
              item.el.style.left = ((v.x * 0.5 + 0.5) * window.innerWidth) + "px";
              item.el.style.top = ((-v.y * 0.5 + 0.5) * window.innerHeight) + "px";
            }
          });

          renderer.render(scene, camera);
        }
        animate();
      }

      window.addEventListener("load", init3D);
    })();
  </script>
</body>
</html>
